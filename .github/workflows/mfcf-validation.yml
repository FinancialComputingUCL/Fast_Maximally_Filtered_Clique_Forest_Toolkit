name: MFCF validation

on:
  pull_request:
  push:
    branches: [main, mutual_info, dev]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy networkx pytest scikit-learn optuna
      - name: Test available MFCF implementations
        run: |
          found=0
          for dir in src src_speed; do
            if [ -f "$dir/test_mfcf_validation.py" ]; then
              found=1
              PYTHONPATH="$dir" python -m pytest -q "$dir/test_mfcf_validation.py"
            fi
            for extra in test_mfcf_robustness.py test_mfcf_properties.py; do
              if [ -f "$dir/$extra" ]; then
                PYTHONPATH="$dir" python -m pytest -q "$dir/$extra"
              fi
            done
          done
          test "$found" -eq 1