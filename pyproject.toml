[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mfcf-toolkit"
version = "2026.10.0"
description = "Maximally Filtered Clique Forests: sparse decomposable graphical models, LoGo precision estimation and DBHT clustering"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "scipy>=1.9"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
sklearn = ["scikit-learn>=1.2"]
cv = ["scikit-learn>=1.2", "optuna>=3"]
dbht = ["riskfolio-lib"]
test = ["pytest", "pytest-timeout", "networkx", "scikit-learn>=1.2", "optuna>=3"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["fast_fast_mfcf", "mfcf_logo", "mfcf_dbht"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src"]
filterwarnings = [
    "ignore:The default gain_function_type changed:FutureWarning",
]
